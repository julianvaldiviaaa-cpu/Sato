; Pool de PHP-FPM para produccion (Sato)
; clear_env=no es CRITICO: conserva las variables de entorno del contenedor
; para que Laravel lea .env / env vars de Docker compose.

[www]
user = www-data
group = www-data
listen = 0.0.0.0:9000
listen.owner = www-data
listen.group = www-data

pm = dynamic
pm.max_children = 50
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500

clear_env = no

; Logs
catch_workers_output = yes
php_flag[display_errors] = off
php_admin_flag[log_errors] = on
