# =====================================================================
#  Configuracion de Render (render.yaml) - Despliegue Blueprint
#  Un solo web service que sirve la web Y los WebSockets de Reverb
#  (Render envia todo el trafico publico por un unico puerto $PORT).
# =====================================================================
services:
  - type: web
    name: sato-app
    runtime: docker
    repo: https://github.com/julianvaldiviaaa-cpu/Sato
    plan: free
    region: oregon
    healthCheckPath: /up
    dockerContext: .
    dockerfilePath: ./Dockerfile
    buildCommand: ""
    # Corre el modo "render" del entrypoint (nginx + php-fpm + reverb).
    # Para runtime docker se usa dockerCommand (no startCommand).
    dockerCommand: render
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        sync: false            # rellenada en el dashboard (php artisan key:generate)
      - key: APP_URL
        sync: false            # rellenada con la URL publica de Render
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        sync: false            # tu cadena de conexion Neon
      - key: BROADCAST_CONNECTION
        value: reverb
      - key: REVERB_APP_ID
        value: local
      - key: REVERB_APP_KEY
        value: sato-local-key
      - key: REVERB_APP_SECRET
        value: sato-local-secret
      # Internos (el WS publico lo sirve nginx sobre el mismo $PORT)
      - key: REVERB_HOST
        value: 127.0.0.1
      - key: REVERB_PORT
        value: "8080"
      - key: REVERB_SCHEME
        value: http
      - key: REVERB_SERVER_HOST
        value: 0.0.0.0
      - key: REVERB_SERVER_PORT
        value: "8080"
      # Servidor de email (Resend)
      - key: MAIL_MAILER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: Sato